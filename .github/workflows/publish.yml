name: publish
# Manual npm publish through npm trusted publishing (OIDC): no npm token is
# stored anywhere. It is OFF until the one-time setup in docs/release.md
# ("Optional: publish from GitHub Actions") is done:
#   1. on npmjs.com, add this repository + workflow file `publish.yml` as the
#      package's Trusted Publisher;
#   2. in GitHub, set the repository variable NPM_TRUSTED_PUBLISHING=configured.
# Until step 2 the job stops at its first step with an explanation.
# Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0 (docs.npmjs.com/trusted-publishers).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets npm exchange the GitHub OIDC token; nothing else
    steps:
      - name: Require trusted publishing to be configured
        if: ${{ vars.NPM_TRUSTED_PUBLISHING != 'configured' }}
        run: |
          echo "::error title=Trusted publishing not configured::This workflow publishes with npm trusted publishing (OIDC) and no token. Do the one-time setup in docs/release.md first: add jre-coder/expense-tracker-bridge with workflow publish.yml as the Trusted Publisher on npmjs.com, then set the repository variable NPM_TRUSTED_PUBLISHING=configured. Until then, publish from a terminal with 'npm publish'."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Upgrade npm to a version that supports trusted publishing
        run: npm install --global npm@11.21.1 && npm --version
      - run: npm ci
      - name: Refuse to publish a version that is already on npm
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$NAME@$VERSION is already published; bump the version first."
            exit 1
          fi
      - name: Tarball smoke test
        run: npm run smoke:pack
      - name: Publish (prepublishOnly runs typecheck, lint and tests; prepack builds)
        run: npm publish --provenance --access public
